.gttl{flex:1;min-width:0;display:flex;flex-direction:column}
.gttl strong{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gstat{font-size:13px;color:#b9c6ef}
.gcnt{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-weight:700}
.gcnt svg{width:18px;height:18px}
.ggrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));grid-auto-rows:1fr;gap:8px;padding:6px 10px}
.gtile{position:relative;border-radius:20px;overflow:hidden;background:#0d1a45;display:grid;place-items:center;min-height:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:box-shadow .2s}
.gtile.spk{box-shadow:inset 0 0 0 3px #22d3a0,0 0 24px -6px #22d3a0}
.gtile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;background:#000}
.gtile.hasv video{opacity:1}
.gtile.me.mirror video{transform:scaleX(-1)}
.gtile .gav{width:min(30%,96px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--ac,#2b3fa8);font-weight:800;font-size:clamp(22px,5vw,40px);color:#fff;box-shadow:0 10px 30px -10px #000}
.gtile.hasv .gav{display:none}
.gname{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 50px);padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.45);font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmut{position:absolute;right:10px;bottom:10px;width:28px;height:28px;border-radius:50%;background:#FF2D3F;display:none;place-items:center}
.gmut svg{width:16px;height:16px}
.gtile.muted .gmut{display:grid}
.gwait{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;color:#cfe0ff;background:rgba(0,0,0,.35);padding:3px 10px;border-radius:999px}
.gtile.ok .gwait{display:none}
.gbar{display:flex;justify-content:center;gap:14px;padding:14px 12px 18px}
.gbtn{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;min-width:64px}
.gbtn svg{width:58px;height:58px;padding:16px;border-radius:50%;background:rgba(255,255,255,.14);box-sizing:border-box}
.gbtn.off svg{background:#fff;color:#0a1236}
.gbtn small{font-size:12px;color:#cfd8f5}
.gbtn.gend svg{background:#FF2D3F}
.gpill{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:65;display:flex;align-items:center;gap:8px;max-width:92vw;padding:9px 16px;border-radius:999px;background:#22A06B;color:#fff;font-weight:700;font-size:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.gpill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gpill i{width:9px;height:9px;border-radius:50%;background:#fff;animation:gblink 1s infinite}
@keyframes gblink{50%{opacity:.3}}
.gring{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:80;width:min(440px,94vw);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px;border-radius:20px;background:#0a1236;color:#fff;box-shadow:0 24px 60px -20px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.1);animation:gdrop .25s ease-out}
@keyframes gdrop{from{transform:translate(-50%,-20px);opacity:0}}
.gring .gav{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--ac,#2b3fa8);font-weight:800;font-size:20px}
.grtxt{flex:1;min-width:150px;display:flex;flex-direction:column}
.grtxt span{font-size:13px;color:#b9c6ef}
.grbtns{display:flex;gap:8px;margin-inline-start:auto}
.gring .ghost{background:rgba(255,255,255,.12);color:#fff;border:0}
.gring .primary{background:#22A06B;box-shadow:none}
@media(prefers-reduced-motion:reduce){.gjoin,.gpill i{animation:none}}

"إنهاء المكالمة"],["Flip camera","Retourner la caméra","Cambiar cámara","قلب الكاميرا"],["Call ended","Appel terminé","Llamada finalizada","انتهت المكالمة"],["Call declined","Appel refusé","Llamada rechazada","تم رفض المكالمة"],["No answer","Pas de réponse","Sin respuesta","لا يوجد رد"],["Connection lost","Connexion perdue","Conexión perdida","انقطع الاتصال"],["You are already in a call.","Vous êtes déjà en appel.","Ya estás en una llamada.","أنت في مكالمة بالفعل."],["Accept this chat request first.","Acceptez d'abord cette demande.","Acepta primero esta solicitud.","اقبل طلب المحادثة هذا أولاً."],["Calls are not supported in this browser.","Les appels ne sont pas pris en charge par ce navigateur.","Las llamadas no son compatibles con este navegador.","المكالمات غير مدعومة في هذا المتصفح."],["Camera unavailable, continuing with voice only.","Caméra indisponible, appel vocal uniquement.","Cámara no disponible, continuando solo con voz.","الكاميرا غير متاحة، سنكمل بالصوت فقط."],["Call back","Rappeler","Devolver llamada","معاودة الاتصال"],["Outgoing","Sortant","Saliente","صادر"],["Incoming","Entrant","Entrante","وارد"],["Missed voice call","Appel vocal manqué","Llamada de voz perdida","مكالمة صوتية فائتة"],["Missed video call","Appel vidéo manqué","Videollamada perdida","مكالمة فيديو فائتة"],["Voice call declined","Appel vocal refusé","Llamada de voz rechazada","تم رفض المكالمة الصوتية"],["Video call declined","Appel vidéo refusé","Videollamada rechazada","تم رفض مكالمة الفيديو"],["Voice call cancelled","Appel vocal annulé","Llamada de voz cancelada","أُلغيت المكالمة الصوتية"],["Video call cancelled","Appel vidéo annulé","Videollamada cancelada","أُلغيت مكالمة الفيديو"],["Voice call failed","Échec de l'appel vocal","Falló la llamada de voz","فشلت المكالمة الصوتية"],["Video call failed","Échec de l'appel vidéo","Falló la videollamada","فشلت مكالمة الفيديو"],["Copied","Copié","Copiado","تم النسخ"],["Loading photo…","Chargement de la photo…","Cargando foto…","جارٍ تحميل الصورة…"],["Retry","Réessayer","Reintentar","إعادة المحاولة"],["Transfer failed","Échec du transfert","Falló la transferencia","فشل النقل"],["Language","Langue","Idioma","اللغة"],["Sound effects","Effets sonores","Efectos de sonido","المؤثرات الصوتية"],["Play sounds","Jouer les sons","Reproducir sonidos","تشغيل الأصوات"],["Messages, calls and taps.","Messages, appels et touches.","Mensajes, llamadas y toques.","الرسائل والمكالمات والنقرات."],["Volume","Volume","Volumen","الصوت"],["AI assistant","Assistant IA","Asistente de IA","المساعد الذكي"],["API key (sk-…)","Clé API (sk-…)","Clave API (sk-…)","مفتاح API (sk-…)"],["OpenAI no longer hands out free keys. Any OpenAI-compatible service works: paste its key, address and model. Free tiers exist at OpenRouter, Groq and Google Gemini. The key stays on this device only.","OpenAI ne distribue plus de clés gratuites. Tout service compatible OpenAI fonctionne : collez sa clé, son adresse et son modèle. Des offres gratuites existent chez OpenRouter, Groq et Google Gemini. La clé reste sur cet appareil.","OpenAI ya no ofrece claves gratis. Sirve cualquier servicio compatible con OpenAI: pega su clave, dirección y modelo. Hay planes gratuitos en OpenRouter, Groq y Google Gemini. La clave solo se queda en este dispositivo.","لم تعد OpenAI تمنح مفاتيح مجانية. تعمل أي خدمة متوافقة مع OpenAI: الصق مفتاحها وعنوانها ونموذجها. توجد باقات مجانية لدى OpenRouter وGroq وGoogle Gemini. يبقى المفتاح على هذا الجهاز فقط."],["Open AI chat","Ouvrir le chat IA","Abrir chat de IA","فتح محادثة الذكاء الاصطناعي"],["Show welcome screen","Afficher l'écran d'accueil","Mostrar pantalla de bienvenida","عرض شاشة الترحيب"],["AI Assistant","Assistant IA","Asistente de IA","المساعد الذكي"],["Hi! I'm your AI assistant. Add your API key in Settings, then ask me anything.","Bonjour ! Je suis votre assistant IA. Ajoutez votre clé API dans les Paramètres, puis posez-moi vos questions.","¡Hola! Soy tu asistente de IA. Añade tu clave API en Ajustes y pregúntame lo que quieras.","مرحباً! أنا مساعدك الذكي. أضف مفتاح API في الإعدادات ثم اسألني أي شيء."],["Add your API key in Settings to chat with the AI.","Ajoutez votre clé API dans les Paramètres pour discuter avec l'IA.","Añade tu clave API en Ajustes para chatear con la IA.","أضف مفتاح API في الإعدادات للدردشة مع الذكاء الاصطناعي."],["The API key was rejected. Check it in Settings.","La clé API a été refusée. Vérifiez-la dans les Paramètres.","La clave API fue rechazada. Revísala en Ajustes.","تم رفض مفتاح API. تحقق منه في الإعدادات."],["The AI service says the quota or rate limit was reached.","Le service IA indique que le quota ou la limite est atteint.","El servicio de IA indica que se alcanzó la cuota o el límite.","تفيد خدمة الذكاء الاصطناعي ببلوغ الحصة أو حد الطلبات."],["The AI model or address was not found. Check Settings.","Modèle ou adresse IA introuvable. Vérifiez les Paramètres.","No se encontró el modelo o la dirección de IA. Revisa Ajustes.","لم يُعثر على نموذج الذكاء الاصطناعي أو العنوان. تحقق من الإعدادات."],["Could not reach the AI service. Check your connection and the address in Settings.","Service IA injoignable. Vérifiez votre connexion et l'adresse dans les Paramètres.","No se pudo contactar con el servicio de IA. Revisa tu conexión y la dirección en Ajustes.","تعذّر الوصول إلى خدمة الذكاء الاصطناعي. تحقق من الاتصال والعنوان في الإعدادات."],["Private, encrypted chats. Message by phone number or QR code.","Discussions privées et chiffrées. Écrivez par numéro ou QR code.","Chats privados y cifrados. Escribe por número de teléfono o código QR.","محادثات خاصة ومشفّرة. راسل برقم الهاتف أو رمز QR."],["Encrypted chats with anyone","Discussions chiffrées avec tout le monde","Chats cifrados con cualquiera","محادثات مشفّرة مع أي شخص"],["Voice and video calls","Appels vocaux et vidéo","Llamadas de voz y vídeo","مكالمات صوتية ومرئية"],["Share your location on a map","Partagez votre position sur une carte","Comparte tu ubicación en un mapa","شارك موقعك على الخريطة"],["Built-in AI assistant","Assistant IA intégré","Asistente de IA integrado","مساعد ذكي مدمج"],["Get started","Commencer","Comenzar","ابدأ الآن"],["Set up permissions first","Configurer d'abord les autorisations","Configurar permisos primero","اضبط الأذونات أولاً"],["Secure connection needed","Connexion sécurisée requise","Se necesita conexión segura","مطلوب اتصال آمن"],["Join me on Redapp","Rejoignez-moi sur Redapp","Únete a mí en Redapp","انضم إليّ على Redapp"],["Chat list style","Style de la liste","Estilo de la lista","شكل قائمة المحادثات"],["Cobweb","Toile d'araignée","Telaraña","شبكة العنكبوت"],["Classic list","Liste classique","Lista clásica","قائمة كلاسيكية"],["API key","Clé API","Clave API","مفتاح API"],["Pick Google Gemini and paste your Gemini API key (it starts with AIza). Other OpenAI-compatible services also work. The key stays on this device only.","Choisissez Google Gemini et collez votre clé API Gemini (elle commence par AIza). D'autres services compatibles OpenAI fonctionnent aussi. La clé reste sur cet appareil.","Elige Google Gemini y pega tu clave API de Gemini (empieza por AIza). También funcionan otros servicios compatibles con OpenAI. La clave solo se queda en este dispositivo.","اختر Google Gemini والصق مفتاح Gemini API (يبدأ بـ AIza). تعمل أيضاً خدمات أخرى متوافقة مع OpenAI. يبقى المفتاح على هذا الجهاز فقط."],["Access denied (403). In Google AI Studio, make sure the key has no website restriction, or create a new key.","Accès refusé (403). Dans Google AI Studio, vérifiez que la clé n'a pas de restriction de site, ou créez-en une nouvelle.","Acceso denegado (403). En Google AI Studio, comprueba que la clave no tenga restricción de sitio web, o crea una nueva.","تم رفض الوصول (403). في Google AI Studio تأكد أن المفتاح بلا قيود على المواقع، أو أنشئ مفتاحاً جديداً."],["The AI service says the quota or rate limit was reached. Wait a minute and try again.","Le service IA indique que le quota est atteint. Attendez une minute et réessayez.","El servicio de IA indica que se alcanzó el límite. Espera un minuto e inténtalo de nuevo.","تفيد الخدمة ببلوغ الحد المسموح. انتظر دقيقة وحاول مجدداً."],["The AI model or address was not found. Check the model name in Settings.","Modèle ou adresse IA introuvable. Vérifiez le nom du modèle dans les Paramètres.","No se encontró el modelo o la dirección de IA. Revisa el nombre del modelo en Ajustes.","لم يُعثر على النموذج أو العنوان. تحقق من اسم النموذج في الإعدادات."],["Could not reach the AI service. Check your internet connection.","Service IA injoignable. Vérifiez votre connexion internet.","No se pudo contactar con el servicio de IA. Revisa tu conexión a internet.","تعذّر الوصول إلى خدمة الذكاء الاصطناعي. تحقق من اتصال الإنترنت."],["Message alerts","Alertes de messages","Alertas de mensajes","تنبيهات الرسائل"],["Test","Tester","Probar","تجربة"],["Help","Aide","Ayuda","مساعدة"],["Notifications are working.","Les notifications fonctionnent.","Las notificaciones funcionan.","الإشعارات تعمل."],["Open your browser site settings and allow notifications.","Ouvrez les réglages du site dans votre navigateur et autorisez les notifications.","Abre los ajustes del sitio en tu navegador y permite las notificaciones.","افتح إعدادات الموقع في المتصفح واسمح بالإشعارات."],["Allow notifications","Autoriser les notifications","Permitir notificaciones","السماح بالإشعارات"],["Notifications on","Notifications activées","Notificaciones activadas","الإشعارات مفعّلة"],["Calls over the internet","Appels via Internet","Llamadas por Internet","المكالمات عبر الإنترنت"],["Automatic (no relay)","Automatique (sans relais)","Automático (sin relé)","تلقائي (بدون مرحّل)"],["Metered relay (free account)","Relais Metered (compte gratuit)","Relé Metered (cuenta gratis)","مرحّل Metered (حساب مجاني)"],["My own TURN server","Mon propre serveur TURN","Mi propio servidor TURN","خادم TURN الخاص بي"],["Metered app name (example: myapp)","Nom de l'app Metered (ex. myapp)","Nombre de la app Metered (ej. myapp)","اسم تطبيق Metered (مثال: myapp)"],["Metered API key","Clé API Metered","Clave API de Metered","مفتاح API لـ Metered"],["turn:host:3478 (you can add several)","turn:hote:3478 (vous pouvez en ajouter plusieurs)","turn:host:3478 (puedes añadir varios)","turn:host:3478 (يمكن إضافة عدة خوادم)"],["Username","Nom d'utilisateur","Usuario","اسم المستخدم"],["Password","Mot de passe","Contraseña","كلمة المرور"],["Test relay","Tester le relais","Probar relé","اختبار المرحّل"],["Testing…","Test en cours…","Probando…","جارٍ الاختبار…"],["Relay works ✓","Le relais fonctionne ✓","El relé funciona ✓","المرحّل يعمل ✓"],["No relay set. Calls across different networks may fail.","Aucun relais défini. Les appels entre réseaux différents peuvent échouer.","Sin relé configurado. Las llamadas entre redes distintas pueden fallar.","لا يوجد مرحّل. قد تفشل المكالمات بين الشبكات المختلفة."],["The relay did not answer. Check the details and your internet.","Le relais n'a pas répondu. Vérifiez les informations et votre connexion.","El relé no respondió. Revisa los datos y tu conexión.","لم يستجب المرحّل. تحقق من البيانات والاتصال."],["This app already has a built-in call relay, so calls work across networks. You can override it here.","Cette app a déjà un relais d'appel intégré : les appels fonctionnent entre réseaux. Vous pouvez le remplacer ici.","Esta app ya tiene un relé de llamadas integrado, así que las llamadas funcionan entre redes. Puedes cambiarlo aquí.","يحتوي هذا التطبيق على مرحّل مكالمات مدمج، لذا تعمل المكالمات بين الشبكات. يمكنك تغييره هنا."],["Calls between different networks need a relay (TURN). Create a free account at metered.ca (20 GB per month free), add a credential, then paste the app name and API key here.","Les appels entre réseaux différents nécessitent un relais (TURN). Créez un compte gratuit sur metered.ca (20 Go/mois gratuits), ajoutez un identifiant, puis collez ici le nom de l'app et la clé API.","Las llamadas entre redes distintas necesitan un relé (TURN). Crea una cuenta gratis en metered.ca (20 GB al mes gratis), añade una credencial y pega aquí el nombre de la app y la clave API.","تحتاج المكالمات بين الشبكات المختلفة إلى مرحّل (TURN). أنشئ حساباً مجانياً على metered.ca (20 جيجابايت شهرياً مجاناً)، أضف بيانات اعتماد، ثم الصق اسم التطبيق ومفتاح API هنا."],["Connection lost. To call across different networks, set up a call relay in Settings (Calls over the internet).","Connexion perdue. Pour appeler entre réseaux différents, configurez un relais dans Paramètres (Appels via Internet).","Conexión perdida. Para llamar entre redes distintas, configura un relé en Ajustes (Llamadas por Internet).","انقطع الاتصال. للاتصال بين شبكات مختلفة، اضبط مرحّلاً في الإعدادات (المكالمات عبر الإنترنت)."],["Turn on notifications","Activer les notifications","Activar notificaciones","فعّل الإشعارات"],["Get an alert with the sender's name and message when Redapp is in the background.","Recevez une alerte avec le nom de l'expéditeur et le message quand Redapp est en arrière-plan.","Recibe un aviso con el nombre del remitente y el mensaje cuando Redapp esté en segundo plano.","احصل على تنبيه باسم المرسل والرسالة عندما يكون Redapp في الخلفية."],["Notifications are blocked","Notifications bloquées","Notificaciones bloqueadas","الإشعارات محظورة"],["Tap the lock icon next to the address bar, open Notifications and choose Allow.","Touchez l'icône du cadenas près de la barre d'adresse, ouvrez Notifications et choisissez Autoriser.","Toca el icono del candado junto a la barra de direcciones, abre Notificaciones y elige Permitir.","اضغط على أيقونة القفل بجانب شريط العنوان، افتح الإشعارات واختر السماح."],["Enable","Activer","Activar","تفعيل"],["Notifications are on.","Les notifications sont activées.","Las notificaciones están activadas.","الإشعارات مفعّلة."],["Connect with QR","Connexion par QR","Conectar con QR","الاتصال عبر QR"],["Link two devices without typing a phone number.","Reliez deux appareils sans saisir de numéro de téléphone.","Vincula dos dispositivos sin escribir un número de teléfono.","اربط جهازين دون كتابة رقم هاتف."],["Built-in AI (made from scratch, works offline)","IA intégrée (faite de zéro, fonctionne hors ligne)","IA integrada (hecha desde cero, funciona sin conexión)","ذكاء اصطناعي مدمج (مبني من الصفر، يعمل بدون إنترنت)"],["Online model (needs an API key)","Modèle en ligne (clé API requise)","Modelo en línea (requiere clave API)","نموذج عبر الإنترنت (يتطلب مفتاح API)"],["Runs on your device with no internet and no API key. It never trains while you use the app. You can teach it new answers by writing: teach: question => answer.","Fonctionne sur votre appareil, sans internet ni clé API. Il n'apprend jamais pendant que vous utilisez l'appli. Vous pouvez lui apprendre de nouvelles réponses en écrivant : teach: question => réponse.","Funciona en tu dispositivo, sin internet ni clave API. Nunca entrena mientras usas la app. Puedes enseñarle respuestas nuevas escribiendo: teach: pregunta => respuesta.","يعمل على جهازك بدون إنترنت أو مفتاح API. لا يتدرّب أبداً أثناء استخدامك للتطبيق. يمكنك تعليمه إجابات جديدة بكتابة: teach: سؤال => جواب."],["Hi! I'm Redapp AI, built from scratch inside this app. Ask me about Redapp, math, the time, jokes… or type “help”.","Salut ! Je suis Redapp AI, fait de zéro dans cette appli. Demande-moi des infos sur Redapp, des calculs, l'heure, des blagues… ou écris « help ».","¡Hola! Soy Redapp AI, hecho desde cero dentro de esta app. Pregúntame sobre Redapp, cálculos, la hora, chistes… o escribe «help».","مرحباً! أنا Redapp AI، بُنيت من الصفر داخل هذا التطبيق. اسألني عن Redapp أو الحساب أو الوقت أو النكات… أو اكتب «help»."],["Secure messenger","Messagerie sécurisée","Mensajería segura","مراسلة آمنة"],["No chats yet. Start one with a phone number, or link a device from Settings, Connect with QR.","Aucune discussion. Commencez avec un numéro, ou reliez un appareil depuis Paramètres, Connexion par QR.","Aún no hay chats. Empieza con un número, o vincula un dispositivo desde Ajustes, Conectar con QR.","لا توجد محادثات بعد. ابدأ برقم هاتف، أو اربط جهازاً من الإعدادات ثم الاتصال عبر QR."],["Relay credentials","Identifiants du relais","Credenciales del relé","بيانات اعتماد المرحّل"],["Relay connection","Connexion au relais","Conexión al relé","الاتصال بالمرحّل"],["OK","OK","OK","جيد"],["Failed","Échec","Falló","فشل"],["Found","Trouvée","Encontrada","وُجد"],["Not found","Introuvable","No encontrada","غير موجود"],["This network may block relays. Try another network (for example mobile data) and test again.","Ce réseau bloque peut-être les relais. Essayez un autre réseau (par exemple les données mobiles) et testez à nouveau.","Esta red puede bloquear los relés. Prueba otra red (por ejemplo datos móviles) y vuelve a probar.","قد تحظر هذه الشبكة المرحّلات. جرّب شبكة أخرى (مثل بيانات الجوال) وأعد الاختبار."],["RedAI","RedAI","RedAI","RedAI"],["Pick from contacts","Choisir dans les contacts","Elegir de los contactos","اختيار من جهات الاتصال"],["Import contacts file","Importer un fichier de contacts","Importar archivo de contactos","استيراد ملف جهات الاتصال"],["Check the country code, then tap Find.","Vérifiez l'indicatif du pays, puis touchez Trouver.","Revisa el código de país y toca Buscar.","تحقق من رمز الدولة ثم اضغط بحث."],["No contacts found in that file.","Aucun contact trouvé dans ce fichier.","No se encontraron contactos en ese archivo.","لم يُعثر على جهات اتصال في هذا الملف."],["Answer","Répondre","Responder","رد"],["Weak connection: voice-only mode","Connexion faible : mode audio seul","Conexión débil: modo solo voz","اتصال ضعيف: وضع الصوت فقط"],["Calls connect directly when they can. If the two networks block that, the call automatically switches to voice-only over the chat connection, so no relay server is needed. Optional: add a TURN relay above for full-quality calls on every network.","Les appels se connectent directement quand c'est possible. Si les deux réseaux l'empêchent, l'appel passe automatiquement en audio seul via la connexion de discussion, sans serveur relais. Facultatif : ajoutez un relais TURN ci-dessus pour des appels de pleine qualité sur tous les réseaux.","Las llamadas se conectan directamente cuando pueden. Si las dos redes lo impiden, la llamada pasa automáticamente a solo voz por la conexión del chat, sin servidor de relé. Opcional: añade un relé TURN arriba para llamadas de calidad completa en cualquier red.","تتصل المكالمات مباشرة عندما يمكن ذلك. وإذا منعت الشبكتان ذلك، تتحول المكالمة تلقائياً إلى صوت فقط عبر اتصال المحادثة، دون حاجة إلى خادم مرحّل. اختياري: أضف مرحّل TURN أعلاه لمكالمات بجودة كاملة على كل الشبكات."],["Hi! I'm RedAI, built from scratch inside Redapp. Ask me about the app, math, reminders, translations, jokes… or type “help”.","Salut ! Je suis RedAI, fait de zéro dans Redapp. Demande-moi des infos sur l'appli, des calculs, des rappels, des traductions, des blagues… ou écris « help ».","¡Hola! Soy RedAI, hecho desde cero dentro de Redapp. Pregúntame sobre la app, cálculos, recordatorios, traducciones, chistes… o escribe «help».","مرحباً! أنا RedAI، بُنيت من الصفر داخل Redapp. اسألني عن التطبيق أو الحساب أو التذكيرات أو الترجمة أو النكات… أو اكتب «help»."],["Profile","Profil","Perfil","الملف الشخصي"],["Notifications & sound","Notifications et sons","Notificaciones y sonido","الإشعارات والصوت"],["Calls","Appels","Llamadas","المكالمات"],["Privacy","Confidentialité","Privacidad","الخصوصية"],["Edit","Modifier","Editar","تعديل"],["Delete for me","Supprimer pour moi","Eliminar para mí","حذف لدي"],["Delete for everyone","Supprimer pour tous","Eliminar para todos","حذف للجميع"],["Copy","Copier","Copiar","نسخ"],["Edit message","Modifier le message","Editar mensaje","تعديل الرسالة"],["A message cannot be empty. Use Delete instead.","Un message ne peut pas être vide. Utilisez Supprimer.","Un mensaje no puede estar vacío. Usa Eliminar.","لا يمكن أن تكون الرسالة فارغة. استخدم الحذف."],["This message was deleted","Ce message a été supprimé","Este mensaje fue eliminado","تم حذف هذه الرسالة"],["Tip: press and hold a message to edit or delete it.","Astuce : maintenez un message appuyé pour le modifier ou le supprimer.","Consejo: mantén pulsado un mensaje para editarlo o eliminarlo.","نصيحة: اضغط مطولاً على رسالة لتعديلها أو حذفها."],["Built-in first, online model for what it does not know","D'abord l'IA intégrée, modèle en ligne pour ce qu'elle ne sait pas","Primero la IA integrada, modelo en línea para lo que no sabe","الذكاء المدمج أولاً، ونموذج عبر الإنترنت لما لا يعرفه"],["Online model only (needs an API key)","Modèle en ligne uniquement (clé API requise)","Solo modelo en línea (requiere clave API)","نموذج عبر الإنترنت فقط (يتطلب مفتاح API)"],["How calls connect","Mode de connexion des appels","Cómo se conectan las llamadas","طريقة اتصال المكالمات"],["Automatic (recommended)","Automatique (recommandé)","Automático (recomendado)","تلقائي (موصى به)"],["Direct only (same Wi-Fi or local network)","Direct uniquement (même Wi-Fi ou réseau local)","Solo directo (mismo Wi-Fi o red local)","مباشر فقط (نفس الواي فاي أو الشبكة المحلية)"],["Voice over the chat first (works on any network)","Audio via la discussion d'abord (fonctionne sur tout réseau)","Voz por el chat primero (funciona en cualquier red)","الصوت عبر المحادثة أولاً (يعمل على أي شبكة)"],["Automatic tries a direct call and switches to voice over the chat connection if it cannot connect. Bluetooth calling is not possible from a web page; it needs a native Android app.","Automatique tente un appel direct puis passe à l'audio via la connexion de discussion s'il ne peut pas se connecter. Les appels Bluetooth sont impossibles depuis une page web ; il faut une appli Android native.","Automático intenta una llamada directa y pasa a voz por la conexión del chat si no puede conectar. Las llamadas por Bluetooth no son posibles desde una página web; necesitan una app nativa de Android.","يحاول الوضع التلقائي إجراء مكالمة مباشرة ثم ينتقل إلى الصوت عبر اتصال المحادثة إذا تعذّر الاتصال. المكالمات  contraseña, jugar piedra-papel-tijera, contar adivinanzas, chistes y datos curiosos, y ayudarte con Redapp. Enséñame con: teach: pregunta => respuesta"],"ar":["يمكنني الدردشة، ومعرفة الوقت والتاريخ، والحساب (12*(3+4)، 20% من 150، sin(30)، 5!)، وتحويل الوحدات (5 km إلى miles)، وضبط التذكيرات (ذكرني بعد 10 دقائق أن أتصل بأمي)، وترجمة عبارات شائعة (كيف أقول شكراً بالإسبانية)، ومعرفة العواصم (عاصمة اليابان)، ورمي العملة والنرد، واختيار رقم أو كلمة مرور، ولعب حجر ورقة مقص، والألغاز والنكات والمعلومات، ومساعدتك في Redapp. علّمني بـ: teach: سؤال => جواب"]},"time":{"en":["It's {time}.","The time is {time} right now."],"fr":["Il est {time}.","L'heure est {time}."],"es":["Son las {time}.","La hora es {time}."],"ar":["الساعة الآن {time}.","الوقت الآن {time}."]},"date":{"en":["Today is {date}."],"fr":["Nous sommes le {date}."],"es":["Hoy es {date}."],"ar":["اليوم هو {date}."]},"joke":{"en":["Why don't programmers like nature? Too many bugs.","What do you call a fake noodle? An impasta.","Why did the scarecrow win an award? He was outstanding in his field.","Why can't a bicycle stand up by itself? It's two tired.","Why did the smartphone need glasses? It lost all its contacts.","I would tell you a UDP joke, but you might not get it.","Why did the computer go to the doctor? It caught a virus.","What did the ocean say to the beach? Nothing, it just waved.","Why do bees have sticky hair? Because they use honeycombs."],"fr":["Pourquoi les plongeurs plongent-ils toujours en arrière ? Sinon ils tombent dans le bateau.","Pourquoi les poissons détestent l'ordinateur ? Ils ont peur du net.","Quel est le comble pour un électricien ? De ne pas être au courant.","Pourquoi le livre de maths est triste ? Il a trop de problèmes.","Que fait une fraise sur un cheval ? Tagada tagada !","Pourquoi l'ordinateur va chez le médecin ? Il a attrapé un virus.","Que dit l'océan à la plage ? Rien, il fait juste signe.","Pourquoi les abeilles ont les cheveux collants ? Elles utilisent des rayons de miel."],"es":["¿Qué le dice un 0 a un 8? Bonito cinturón.","¿Por qué los pájaros vuelan al sur? Porque caminando tardarían mucho.","¿Qué hace una abeja en el gimnasio? ¡Zum-ba!","¿Por qué el libro de matemáticas estaba triste? Tenía muchos problemas.","¿Qué le dice una iguana a su hermana gemela? Somos iguanitas.","¿Por qué el ordenador fue al médico? Porque tenía un virus.","¿Qué le dijo el mar a la playa? Nada, solo la saludó.","¿Por qué las abejas tienen el pelo pegajoso? Porque usan panales."],"ar":["لماذا يحمل الكمبيوتر مظلة؟ لأنه يخاف من الفيروسات والسحابة!","لماذا حزن كتاب الرياضيات؟ لأن عنده الكثير من المسائل.","ما هو الشيء الذي له أسنان ولا يعض؟ المشط.","ما هو الشيء الذي كلما زاد نقص؟ العمر.","قال الطالب لأمه: أخذت صفراً في الامتحان... لكنه أجمل صفر في الصف!","لماذا ذهب الحاسوب إلى الطبيب؟ لأنه أصيب بفيروس.","ماذا قال البحر للشاطئ؟ لا شيء، فقط لوّح له بموجة.","لماذا شعر النحل لزج؟ لأنه يستعمل أقراص العسل."]},"coin":{"en":["It's {coin}!"],"fr":["C'est {coin} !"],"es":["¡Salió {coin}!"],"ar":["النتيجة: {coin}!"]},"dice":{"en":["You rolled a {dice}."],"fr":["Tu as fait {dice}."],"es":["Ha salido un {dice}."],"ar":["ظهر الرقم {dice}."]},"random_number":{"en":["How about {num}?"],"fr":["Que dis-tu de {num} ?"],"es":["¿Qué tal el {num}?"],"ar":["ما رأيك بالرقم {num}؟"]},"fun_fact":{"en":["Honey never spoils: edible honey has been found in ancient Egyptian tombs.","Octopuses have three hearts and blue blood.","Bananas are berries, but strawberries are not.","A day on Venus is longer than its year.","Sharks existed before trees.","A group of flamingos is called a flamboyance.","Your heart beats about 100,000 times a day."],"fr":["Le miel ne se périme jamais : on a retrouvé du miel comestible dans des tombes égyptiennes.","Les pieuvres ont trois cœurs et du sang bleu.","Les bananes sont des baies, mais pas les fraises.","Un jour sur Vénus dure plus longtemps que son année.","Les requins existaient avant les arbres.","Un groupe de flamants roses s'appelle une flamboyance.","Ton cœur bat environ 100 000 fois par jour."],"es":["La miel nunca se echa a perder: se ha encontrado miel comestible en tumbas del antiguo Egipto.","Los pulpos tienen tres corazones y sangre azul.","Los plátanos son bayas, pero las fresas no.","Un día en Venus dura más que su año.","Los tiburones existían antes que los árboles.","Un grupo de flamencos se llama «flamboyance».","Tu corazón late unas 100 000 veces al día."],"ar":["العسل لا يفسد أبداً: وُجد عسل صالح للأكل في مقابر مصرية قديمة.","للأخطبوط ثلاثة قلوب ودمه أزرق.","الموز من التوت بينما الفراولة ليست كذلك.","اليوم على كوكب الزهرة أطول من سنته.","وُجدت أسماك القرش قبل الأشجار.","تسمى مجموعة طيور الفلامنغو «فلامبويانس».","يخفق قلبك نحو 100 ألف مرة في اليوم."]},"compliment":{"en":["Thank you{n}! That makes my day.","Aw, thanks! I'll keep doing my best."],"fr":["Merci{n} ! Ça me fait plaisir.","Oh, merci ! Je continue de faire de mon mieux."],"es":["¡Gracias{n}! Me alegras el día.","¡Gracias! Seguiré dando lo mejor."],"ar":["شكراً{n}! هذا يسعدني.","شكراً لك! سأواصل بذل جهدي."]},"insult":{"en":["I'm sorry I let you down. Tell me what went wrong and I'll try again.","That's okay. I'm still learning. What were you looking for?"],"fr":["Désolé de t'avoir déçu. Dis-moi ce qui ne va pas et je réessaie.","Pas de souci, j'apprends encore. Que cherchais-tu ?"],"es":["Lamento haberte fallado. Dime qué pasó y lo intento de nuevo.","No pasa nada, sigo aprendiendo. ¿Qué buscabas?"],"ar":["آسف لأنني خذلتك. أخبرني ما المشكلة وسأحاول مجدداً.","لا بأس، ما زلت أتعلم. ماذا كنت تبحث عنه؟"]},"sad_support":{"en":["I'm sorry you're feeling this way{n}. I'm here to listen. Do you want to tell me what happened? Talking with a friend or someone you trust can help too.","That sounds hard, and you're not alone. Tell me more if you like, and consider reaching out to someone close to you."],"fr":["Je suis désolé que tu te sentes ainsi{n}. Je suis là pour t'écouter. Veux-tu me dire ce qui s'est passé ? En parler à un proche peut aussi aider.","Ça a l'air difficile, et tu n'es pas seul. Dis-m'en plus si tu veux, et pense à en parler à quelqu'un de proche."],"es":["Siento que te sientas así{n}. Estoy aquí para escucharte. ¿Quieres contarme qué pasó? Hablar con un amigo o alguien de confianza también ayuda.","Suena difícil, y no estás solo. Cuéntame más si quieres, y considera hablar con alguien cercano."],"ar":["يؤسفني أنك تشعر بهذا{n}. أنا هنا لأستمع إليك. هل تريد أن تخبرني ماذا حدث؟ والحديث مع صديق أو شخص تثق به قد يساعد أيضاً.","يبدو ذلك صعباً، ولست وحدك. أخبرني المزيد إن أردت، وفكّر في التحدث إلى شخص قريب منك."]},"crisis":{"en":["I'm really sorry you're in so much pain, and I'm glad you told me. Your life matters. If you might act on these thoughts or you are in danger, please call your local emergency number right now, or contact a crisis line in your country. If you can, reach out to someone you trust and stay with them. I'm here to talk too."],"fr":["Je suis vraiment désolé que tu souffres autant, et je suis content que tu me l'aies dit. Ta vie compte. Si tu risques de passer à l'acte ou si tu es en danger, appelle tout de suite le numéro d'urgence de ton pays ou une ligne d'écoute. Si possible, contacte une personne de confiance et reste avec elle. Je suis là pour parler aussi."],"es":["Siento mucho que estés sufriendo tanto, y me alegra que me lo hayas dicho. Tu vida importa. Si podrías actuar según estos pensamientos o estás en peligro, llama ahora mismo al número de emergencias de tu país o a una línea de ayuda. Si puedes, contacta a alguien de confianza y quédate con esa persona. Yo también estoy aquí para hablar."],"ar":["يؤلمني أنك تعاني كل هذا الألم، وأنا سعيد لأنك أخبرتني. حياتك مهمة. إذا كنت قد تنفّذ هذه الأفكار أو كنت في خطر، فاتصل الآن برقم الطوارئ في بلدك أو بخط مساعدة. وإن استطعت، تواصل مع شخص تثق به وابقَ معه. وأنا هنا للحديث أيضاً."]},"bored":{"en":["Want a challenge? Ask me a math question like 17*23, or say “joke” or “fun fact”.","Pick a number from 1 to 10 in your head, then ask me for a random number and see if we match!"],"fr":["Un défi ? Pose-moi un calcul comme 17*23, ou dis « blague » ou « anecdote ».","Pense à un nombre de 1 à 10, puis demande-moi un nombre aléatoire et voyons si on est d'accord !"],"es":["¿Un reto? Hazme una cuenta como 17*23, o di «chiste» o «dato curioso».","Piensa un número del 1 al 10 y pídeme un número aleatorio. ¿Coincidimos?"],"ar":["تريد تحدياً؟ اسألني مسألة مثل 17*23، أو قل «نكتة» أو «معلومة».","فكّر برقم من 1 إلى 10 ثم اطلب مني رقماً عشوائياً وانظر هل نتطابق!"]},"love":{"en":["That's kind of you{n}! I'm an AI, so I can't love like a person, but I'm happy to be your friend here."],"fr":["C'est gentil{n} ! Je suis une IA, je ne peux pas aimer comme une personne, mais je suis content d'être ton ami ici."],"es":["¡Qué amable{n}! Soy una IA y no puedo querer como una persona, pero me alegra ser tu amigo aquí."],"ar":["هذا لطف منك{n}! أنا ذكاء اصطناعي ولا أحب كما يحب البشر، لكنني سعيد بأن أكون صديقك هنا."]},"motivate":{"en":["Small steps still move you forward. Keep going.","You don't have to be perfect, just consistent.","Every expert was once a beginner."],"fr":["Les petits pas font aussi avancer. Continue.","Pas besoin d'être parfait, juste régulier.","Tout expert a été un débutant."],"es":["Los pasos pequeños también avanzan. Sigue.","No tienes que ser perfecto, solo constante.","Todo experto fue alguna vez principiante."],"ar":["الخطوات الصغيرة تقدّمك أيضاً. واصل.","لست مضطراً أن تكون مثالياً، يكفي أن تكون مواظباً.","كل خبير كان مبتدئاً يوماً ما."]},"yes":{"en":["Great! What would you like to do next?"],"fr":["Super ! Que veux-tu faire ensuite ?"],"es":["¡Genial! ¿Qué quieres hacer ahora?"],"ar":["رائع! ماذا تريد أن تفعل الآن؟"]},"no":{"en":["No problem. Let me know if you need anything."],"fr":["Pas de souci. Dis-moi si tu as besoin de quelque chose."],"es":["Sin problema. Avísame si necesitas algo."],"ar":["لا مشكلة. أخبرني إن احتجت شيئاً."]},"sorry":{"en":["No worries at all{n}."],"fr":["Aucun souci{n}."],"es":["No te preocupes{n}."],"ar":["لا عليك{n}."]},"app_calls":{"en":["Open a chat and tap the phone icon for a voice call or the camera icon for a video call. Allow the microphone (and camera) when asked. If a direct connection can't be made between two different networks, the call automatically switches to voice-only over the chat connection. No extra server is needed."],"fr":["Ouvre une discussion et touche l'icône téléphone pour un appel vocal ou l'icône caméra pour un appel vidéo. Autorise le micro (et la caméra) quand on te le demande. Si la connexion directe est impossible entre deux réseaux différents, l'appel passe automatiquement en audio seul via la connexion de discussion. Aucun serveur supplémentaire n'est nécessaire."],"es":["Abre un chat y toca el icono de teléfono para una llamada de voz o el de cámara para una videollamada. Permite el micrófono (y la cámara) cuando te lo pidan. Si no se puede conectar directamente entre dos redes distintas, la llamada pasa automáticamente a solo voz por la conexión del chat. No hace falta ningún servidor extra."],"ar":["افتح محادثة واضغط على أيقونة الهاتف لمكالمة صوتية أو أيقونة الكاميرا لمكالمة فيديو. اسمح بالميكروفون (والكاميرا) عند الطلب. إذا تعذّر الاتصال المباشر بين شبكتين مختلفتين، تتحول المكالمة تلقائياً إلى صوت فقط عبر اتصال المحادثة. لا حاجة إلى أي خادم إضافي."]},"app_qr":{"en":["Go to Settings → Connect with QR. On one device choose “Show my QR”, on the other choose “Scan a QR”. You can also start a chat with a phone number from the New chat button."],"fr":["Va dans Paramètres → Connexion par QR. Sur un appareil choisis « Afficher mon QR », sur l'autre « Scanner un QR ». Tu peux aussi démarrer une discussion avec un numéro depuis le bouton Nouveau chat."],"es":["Ve a Ajustes → Conectar con QR. En un dispositivo elige «Mostrar mi QR» y en el otro «Escanear un QR». También puedes iniciar un chat con un número desde el botón Nuevo chat."],"ar":["اذهب إلى الإعدادات ← الاتصال عبر QR. على جهاز اختر «اعرض رمز QR الخاص بي» وعلى الآخر «امسح رمز QR». ويمكنك أيضاً بدء محادثة برقم هاتف من زر محادثة جديدة."]},"app_notif":{"en":["Tap Enable on the “Turn on notifications” bar, or go to Settings → Notifications and press Allow. If your browser blocked them, tap the lock icon next to the address bar and allow Notifications. Each new message shows the sender and the text, and incoming calls ring as a notification. Note: a web page can only notify while it is open or in the background, not after it is fully closed."],"fr":["Touche Activer sur la barre « Activer les notifications », ou va dans Paramètres → Notifications et appuie sur Autoriser. Si ton navigateur les a bloquées, touche le cadenas près de la barre d'adresse et autorise les notifications. Chaque nouveau message affiche l'expéditeur et le texte, et les appels entrants sonnent en notification. Attention : une page web ne peut notifier que si elle est ouverte ou en arrière-plan, pas une fois complètement fermée."],"es":["Toca Activar en la barra «Activar notificaciones», o ve a Ajustes → Notificaciones y pulsa Permitir. Si tu navegador las bloqueó, toca el candado junto a la barra de direcciones y permite las notificaciones. Cada mensaje nuevo muestra el remitente y el texto, y las llamadas entrantes suenan como notificación. Ojo: una página web solo puede notificar mientras está abierta o en segundo plano, no cuando está cerrada del todo."],"ar":["اضغط «تفعيل» في شريط «فعّل الإشعارات»، أو اذهب إلى الإعدادات ← الإشعارات واضغط السماح. وإذا حظرها المتصفح فاضغط على أيقونة القفل بجانب شريط العنوان واسمح بالإشعارات. تعرض كل رسالة جديدة اسم المرسل ونصها، وتصل المكالمات الواردة كإشعار. ملاحظة: صفحة الويب لا تستطيع الإشعار إلا وهي مفتوحة أو في الخلفية، وليس بعد إغلاقها تماماً."]},"app_lang":{"en":["Open Settings → Language and pick English, العربية, Français or Español. The whole app switches instantly."],"fr":["Ouvre Paramètres → Langue et choisis English, العربية, Français ou Español. Toute l'appli change aussitôt."],"es":["Abre Ajustes → Idioma y elige English, العربية, Français o Español. Toda la app cambia al instante."],"ar":["افتح الإعدادات ← اللغة واختر English أو العربية أو Français أو Español. يتغير التطبيق كله فوراً."]},"app_location":{"en":["In a chat tap the attach button and choose Share location. Allow location when your browser asks, check the map preview, then tap Send my location. People see it as a small map in the chat."],"fr":["Dans une discussion touche le bouton pièce jointe et choisis Partager la position. Autorise la position quand le navigateur le demande, vérifie l'aperçu de la carte, puis touche Envoyer ma position. Les gens la voient sous forme de petite carte."],"es":["En un chat toca el botón de adjuntar y elige Compartir ubicación. Permite la ubicación cuando el navegador lo pida, revisa la vista previa del mapa y toca Enviar mi ubicación. La gente la ve como un pequeño mapa en el chat."],"ar":["في المحادثة اضغط زر المرفقات واختر مشاركة الموقع. اسمح بالموقع عندما يطلب المتصفح، وراجع معاينة الخريطة، ثم اضغط إرسال موقعي. يراه الآخرون كخريطة صغيرة في المحادثة."]},"app_privacy":{"en":["Chats are end-to-end encrypted and stored on your device. I run on your device too, so what you tell me doesn't leave it (unless you switch to an online model in Settings)."],"fr":["Les discussions sont chiffrées de bout en bout et stockées sur ton appareil. Je tourne aussi sur ton appareil : ce que tu me dis n'en sort pas (sauf si tu passes à un modèle en ligne dans les Paramètres)."],"es":["Los chats están cifrados de extremo a extremo y se guardan en tu dispositivo. Yo también funciono en tu dispositivo, así que lo que me digas no sale de él (salvo que cambies a un modelo en línea en Ajustes)."],"ar":["المحادثات مشفّرة من طرف إلى طرف ومخزّنة على جهازك. وأنا أعمل على جهازك أيضاً، فما تخبرني به لا يغادره (إلا إذا انتقلت إلى نموذج عبر الإنترنت من الإعدادات)."]},"app_ai":{"en":["I'm a small AI built from scratch for Redapp: a compact neural network that understands what you mean, plus my own calculator, converter and memory. I run fully on your device and need no internet. I'm not a big language model, so for open questions I may say I don't know. Teach me with: teach: question => answer"],"fr":["Je suis une petite IA faite de zéro pour Redapp : un réseau de neurones compact qui comprend ce que tu veux dire, avec ma propre calculatrice, mon convertisseur et ma mémoire. Je tourne entièrement sur ton appareil, sans internet. Je ne suis pas un grand modèle de langage : pour les questions ouvertes, je peux ne pas savoir. Apprends-moi avec : teach: question => réponse"],"es":["Soy una pequeña IA hecha desde cero para Redapp: una red neuronal compacta que entiende lo que quieres decir, con mi propia calculadora, conversor y memoria. Funciono por completo en tu dispositivo y sin internet. No soy un gran modelo de lenguaje, así que en preguntas abiertas puede que no sepa. Enséñame con: teach: pregunta => respuesta"],"ar":["أنا ذكاء اصطناعي صغير بُني من الصفر لـ Redapp: شبكة عصبية مدمجة تفهم ما تقصده، مع آلة حاسبة ومحوّل ووحدة ذاكرة خاصة بي. أعمل بالكامل على جهازك وبدون إنترنت. لست نموذجاً لغوياً كبيراً، لذا قد لا أعرف إجابة الأسئلة المفتوحة. علّمني بـ: teach: سؤال => جواب"]},"creator":{"en":["I was built from scratch for Redapp by the team behind this app."],"fr":["J'ai été créé de zéro pour Redapp par l'équipe derrière cette appli."],"es":["Me crearon desde cero para Redapp el equipo detrás de esta app."],"ar":["بنى فريق هذا التطبيق نموذجي من الصفر لـ Redapp."]},"weather":{"en":["I work offline, so I can't check the weather. Your phone's weather app can!"],"fr":["Je travaille hors ligne, donc je ne peux pas voir la météo. L'appli météo de ton téléphone le peut !"],"es":["Funciono sin conexión, así que no puedo ver el clima. ¡La app del clima de tu teléfono sí!"],"ar":["أعمل بدون إنترنت لذا لا أستطيع معرفة الطقس. تطبيق الطقس في هاتفك يستطيع ذلك!"]},"oos":{"en":["I don't know that one yet. I'm a small AI built from scratch, so I may not know everything.     if (p && o.rs && p.offerer) { if (p.restarts < 4) { p.restarts++; makeOffer(p, true); } }
    else connectTo(o.sid, name);
   }
   break;
  case "gcp":
   touch(c, o, name);
   if (st && st.cid === o.cid && !st.peers.has(o.sid)) { connectTo(o.sid, name); send(c, { t: "gch", cid: o.cid, to: o.sid }); }
   break;
  case "gco": onOffer(c, o, name); break;
  case "gca": onAnswer(c, o); break;
  case "gci": onIce(c, o); break;
  case "gcm":
   if (st && st.cid === o.cid) { const p = st.peers.get(o.sid); if (p) { p.mic = o.mic; p.cam = o.cam; paintPeer(p); } }
   break;
  case "gcl": {
   if (st && st.cid === o.cid) dropPeer(o.sid);
   const a = active.get(c.id);
   if (a && a.cid === o.cid && o.last) { active.delete(c.id); if (R().te === c.id) R().T(); }
   if (ringUI && o.last) stopRing();
   break;
  }
 }
}

/* ---------- periodic work ---------- */
setInterval(() => {
 const r = R();
 if (!r || !r.B) return;
 r.B.forEach(c => {
  if (!c.grp) return;
  const n = c.peers.size, s = syncSeen.get(c.id) || { n: 0, at: 0 };
  if (n > 0 && (n > s.n || Date.now() - s.at > 6e5)) { s.at = Date.now(); requestSync(c); }
  s.n = n;
  syncSeen.set(c.id, s);
 });
 active.forEach((a, id) => { if (Date.now() - a.seen > 6e4 && !(call && call.cid === a.cid)) { active.delete(id); if (r.te === id) r.T(); } });
}, 4000);
window.addEventListener("pagehide", () => { if (call) send(call.c, { t: "gcl", cid: call.cid, last: call.peers.size === 0 ? 1 : 0 }); });
addEventListener("resize", () => updateUI());

/* ---------- sidebar button + RedAI suggestion chips ---------- */
function CHIPS() {
 return [
  ["✨ " + t("What can you do?"), t("What can you do?")],
  ["😂 " + t("Tell me a joke"), t("Tell me a joke")],
  ["🧠 " + t("Quiz me"), t("Quiz me")],
  ["🗓️ " + t("Plan my day"), t("Help me plan my day in a few short steps.")],
  ["🎂 " + t("Write a birthday message"), t("Write a short, warm birthday message for a friend.")],
  ["⏰ " + t("Remind me in 10 minutes"), t("remind me in 10 minutes to take a break")]
 ];
}
function sendText(text) {
 const i = document.getElementById("input");
 if (!i) return;
 i.value = text;
 i.dispatchEvent(new Event("input", { bubbles: true }));
 const b = document.getElementById("sendBtn");
 if (b) { b.hidden = false; b.click(); }
}
function chips() {
 const r = R();
 const comp = document.getElementById("composer");
 if (!r || !comp) return;
 const c = r.B.find(x => x.id === r.te);
 let bar = document.getElementById("aichips");
 const mode = c ? (c.ai ? "ai" : (!c.req ? "chat" : "")) : "";
 if (!mode) { if (bar) bar.hidden = true; return; }
 if (!bar) { bar = el("div", { id: "aichips", class: "aichips", "data-notr": "1" }); comp.parentNode.insertBefore(bar, comp); }
 const key = mode + LANG();
 if (bar.dataset.k !== key) {
  bar.dataset.k = key;
  if (mode === "ai") bar.replaceChildren(...CHIPS().map(([label, text]) => el("button", { class: "chip", onclick: () => sendText(text) }, label)));
  else bar.replaceChildren(el("button", { class: "chip ai", onclick: () => { const i = document.getElementById("input"); if (!i) return; if (!/^@RedAI\b/i.test(i.value)) i.value = "@RedAI " + i.value; i.dispatchEvent(new Event("input", { bubbles: true })); i.focus(); }, html: IC.spark + "<span>" + t("Ask RedAI in this chat") + "</span>" }));
 }
 bar.classList.toggle("mini", mode !== "ai");
 bar.hidden = false;
}
function sidebar() {
 const num = document.getElementById("numMode");
 if (!num || document.getElementById("grpMode")) return;
 num.classList.remove("wide");
 const b = el("button", { class: "mode grp", id: "grpMode", "data-notr": "1", onclick: newGroup }, el("strong", {}, t("New group")), el("span", {}, t("Chat & call together")));
 num.after(b);
}
function boot() {
 sidebar();
 const head = document.getElementById("chatHead");
 if (head) new MutationObserver(() => { chips(); const g = document.getElementById("grpMode"); if (g) { g.querySelector("strong").textContent = t("New group"); g.querySelector("span").textContent = t("Chat & call together"); } }).observe(head, { childList: true });
 chips();
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();

window.__grp = { meta, tag, rx, out, call: startCall, headBtn, sub, note, invite, info, newGroup, t, get active() { return active; }, get cur() { return call; } };
})();
</script>

<style id="redapp-multi-accounts-v1">

</style>
<script id="redapp-multi-accounts-v1">
(()=>{"use strict";
const DB="redapp-multi-accounts", STORE="profiles", ACTIVE="redapp.profile.active";
const $=s=>document.querySelector(s);
const openDB=()=>new Promise((resolve,reject)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE,{keyPath:"id"});};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);});
const transact=async(mode,fn)=>{const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,mode),st=tx.objectStore(STORE);let result;try{result=fn(st);}catch(e){reject(e);return;}tx.oncomplete=()=>{db.close();resolve(result&&result.result);};tx.onerror=()=>{db.close();reject(tx.error);};});};
const all=()=>transact("readonly",s=>s.getAll());
const put=v=>transact("readwrite",s=>s.put(v));
const get=id=>transact("readonly",s=>s.get(id));
const snap=()=>{const a=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k!==ACTIVE)a.push([k,localStorage.getItem(k)]);}return a;};
const saveCurrent=async()=>{const id=localStorage.getItem(ACTIVE);if(!id)return;const rec=await get(id);if(rec){rec.data=snap();rec.updated=Date.now();await put(rec);}};
const restore=async rec=>{localStorage.clear();for(const [k,v] of (rec.data||[]))localStorage.setItem(k,v);localStorage.setItem(ACTIVE,rec.id);location.reload();};
const ensure=async()=>{let id=localStorage.getItem(ACTIVE),rec=id?await get(id):null;if(!rec){id=id||("ra_"+Math.random().toString(36).slice(2,11));rec={id,name:localStorage.getItem("hop.name")||"My account",phone:localStorage.getItem("hop.phone")||"",data:snap(),created:Date.now(),updated:Date.now()};await put(rec);localStorage.setItem(ACTIVE,id);}return rec;};
const overlay=()=>$("#raAccountsOverlay")?.remove();
const show=async()=>{try{await ensure();const items=await all();const active=localStorage.getItem(ACTIVE);overlay();const ov=document.createElement("div");ov.id="raAccountsOverlay";ov.addEventListener("click",e=>{if(e.target===ov)overlay();});const panel=document.createElement("section");panel.id="raAccountsPanel";panel.setAttribute("role","dialog");panel.setAttribute("aria-modal","true");panel.setAttribute("aria-label","Accounts");
const title=document.createElement("h2");title.textContent="Accounts";const sub=document.createElement("p");sub.className="raSub";sub.textContent="Switch between separate RedApp profiles on this device.";panel.append(title,sub);
for(const item of items.sort((a,b)=>(b.updated||0)-(a.updated||0))){const row=document.createElement("div");row.className="raItem";const av=document.createElement("div");av.className="raAvatar";av.textContent=(item.name||"R").trim().charAt(0).toUpperCase();const meta=document.createElement("div");meta.className="raMeta";const nm=document.createElement("b");nm.textContent=item.name||"Account";const ph=document.createElement("small");ph.textContent=item.phone||"No phone number added";meta.append(nm,ph);row.append(av,meta);if(item.id===active){const current=document.createElement("small");current.textContent="Active";current.style.color="var(--accent,#3155c9)";row.append(current);}else{const sw=document.createElement("button");sw.className="raGhost";sw.textContent="Switch";sw.addEventListener("click",async()=>{sw.disabled=true;await saveCurrent();const target=await get(item.id);if(target)await restore(target);});row.append(sw);}panel.append(row);}
const foot=document.createElement("div");foot.className="raFoot";const close=document.createElement("button");close.className="raGhost";close.textContent="Close";close.onclick=overlay;const add=document.createElement("button");add.className="raAction";add.textContent="＋ Add account";add.onclick=async()=>{const name=prompt("Name for the new account:");if(name===null)return;if(!name.trim()){alert("Enter an account name.");return;}const phone=prompt("Phone number (optional):")||"";await saveCurrent();const id="ra_"+Math.random().toString(36).slice(2,11);const data=[["hop.name",JSON.stringify(name.trim().slice(0,40))],["hop.phone",JSON.stringify(phone.trim().slice(0,24))]];const rec={id,name:name.trim().slice(0,40),phone:phone.trim().slice(0,24),data,created:Date.now(),updated:Date.now()};await put(rec);await restore(rec);};foot.append(close,add);panel.append(foot);ov.append(panel);document.body.append(ov);
}catch(e){alert("Could not open account manager. Please check that storage is available in this browser.");}};
const install=()=>{const me=$("#meBtn"),tr=me?.parentElement;if(!tr||$("#raAccountsBtn"))return;const b=document.createElement("button");b.id="raAccountsBtn";b.type="button";b.title="Switch accounts";b.setAttribute("aria-label","Switch accounts");b.textContent="⇄";b.addEventListener("click",show);me.insertAdjacentElement("beforebegin",b);};
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",install);else install();
new MutationObserver(install).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
